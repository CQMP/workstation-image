# Kickstart for bootc installation on IFT workstations
# Usage: append inst.ks=https://raw.githubusercontent.com/CQMP/workstation-image/main/ks.cfg
#        to the Anaconda boot line on a CentOS Stream 9 boot USB.
#
# NOTE: verify the disk device name before use. Dell workstations with NVMe
# will use nvme0n1; SATA/SAS disks use sda. Adjust --only-use and --ondisk
# below accordingly.

text
reboot

lang en_US.UTF-8
keyboard us
timezone Europe/Warsaw

network --bootproto=dhcp --activate --onboot=yes

# Lock root — access via LDAP accounts and egull SSH key only
rootpw --lock

# Wipe the target disk and partition it
# 200 GiB for the OS: bootc keeps the booted image, the rollback and a staged upgrade (~40 GB each,
# deduplicated); 50 GB was too small to stage upgrades. Rest for local /scratch (/data is NFS from luttinger-storage)
ignoredisk --only-use=nvme0n1
clearpart --all --initlabel --drives=nvme0n1
part /boot/efi  --fstype=efi   --size=512    --ondisk=nvme0n1
part /boot      --fstype=ext4  --size=1024   --ondisk=nvme0n1
part /          --fstype=xfs   --size=204800 --ondisk=nvme0n1
part /scratch   --fstype=xfs   --grow        --ondisk=nvme0n1 --label=data

# Pull and install the OS image from GHCR
ostreecontainer --url ghcr.io/cqmp/centos9-workstation:latest --transport registry --no-signature-verification

%pre
wipefs -a /dev/nvme0n1
sgdisk --zap-all /dev/nvme0n1
%end

%post --erroronfail
# Anaconda's text install path can leave a mutable /etc default.target pointing
# at multi-user.target. That override wins over the image's /usr/lib default.
systemctl set-default graphical.target
%end
