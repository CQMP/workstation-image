# Zabbix agent 2. Fixed IDs, the same as the user the Containerfile creates before installing the package: machines
# whose /etc/passwd differs from the image's (bootc keeps the local file) get the user from here at boot.
# systemd-journal: ift-zabbix-status reads the boot check outcome and the kernel's e1000e messages.
# Named so it sorts before any sysusers file of the package.
g zabbix 460
u zabbix 460:460 "Zabbix Monitoring System" /var/lib/zabbix /sbin/nologin
m zabbix systemd-journal
