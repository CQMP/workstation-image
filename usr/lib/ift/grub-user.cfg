# IFT boot counting for image updates (installed as /boot/grub2/user.cfg by ift-boot-check).
# ift-update sets ift_boot_counter=3 before rebooting into a new image. Every boot attempt
# counts down; at 0 GRUB starts the second menu entry, the previous deployment.
# ift-boot-check unsets the counter once the new deployment has passed its checks.
if [ -n "${ift_boot_counter}" ]; then
  if [ "${ift_boot_counter}" = "0" ]; then
    set default=1
  elif [ "${ift_boot_counter}" = "1" ]; then
    set ift_boot_counter=0
    save_env ift_boot_counter
  elif [ "${ift_boot_counter}" = "2" ]; then
    set ift_boot_counter=1
    save_env ift_boot_counter
  else
    set ift_boot_counter=2
    save_env ift_boot_counter
  fi
fi
