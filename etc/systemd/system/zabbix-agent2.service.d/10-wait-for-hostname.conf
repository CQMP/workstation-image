# The host name comes from DHCP (NetworkManager, hostname-mode=dhcp), about 13 s after boot; the agent reads it once at
# start (HostnameItem=system.hostname[shorthost]). Started earlier, it registered in Zabbix as "localhost" (Bethe,
# 2026-11-17). Wait for the real name; without one after 3 minutes, fail and let Restart=on-failure try again.
[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 90); do case "$(hostname)" in ""|localhost|localhost.*) sleep 2;; *) exit 0;; esac; done; echo "no host name from DHCP after 180 s"; exit 1'
