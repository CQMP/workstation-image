# Workstation-specific values for Zabbix (template "IFT workstation" on luttinger-master), one JSON object.
# The connection settings (server, host name, metadata) are in zabbix_agent2.conf itself, edited by the Containerfile:
# agent2 refuses parameters defined twice.
UserParameter=ift.status,/usr/local/libexec/ift-zabbix-status
