# Settings for gh-runner-vm (sourced by bash). The GitHub App's private key is not
# in the image: install it as /etc/gh-runner/app.pem (root:root 0600) on each host.

# GitHub App alpsim-ift-uw-workstation-runners (owned by ALPSim, public so that other
# orgs can install it) with the organization permission "Self-hosted runners: read & write".
# The service does nothing until APP_ID and the key are set.
APP_ID=5640055
# Organisations the VMs register in, as org:runner_group_id. Org runners serve only
# repositories of their own org. An idle VM waits in all of them; the first job takes it.
# An org where the App is not installed is skipped (logged).
#   ALPSim:3      ift-workstations, restricted to ALPSim/ALPS, public repositories allowed
#   CQMP:3        ift-workstations, all private repositories
#   Green-Phys:3  ift-workstations, all private repositories
# (gh api orgs/<org>/actions/runner-groups)
ORGS="ALPSim:3 CQMP:3 Green-Phys:3"
# Workflows select these runners with: runs-on: [self-hosted, ift-vm]
RUNNER_LABELS=self-hosted,linux,x64,ift-vm

# Size of each VM. The disk lives in /var/lib/gh-runner on the root partition.
VCPUS=8
# 20 GB: ALPS CI compiles with 16 parallel g++ processes, which ran out of 12 GB.
MEMORY_MB=20480
DISK_GB=60

# Same as HTCondor's START: graphical session idle for 15 minutes.
IDLE_SECONDS=900
# A running job is killed after this long (GitHub's default job timeout is 6 h).
MAX_JOB_SECONDS=25200

# The VM can reach the internet only. Private ranges (incl. the LDAP servers 10.2.5.11/12)
# are always blocked; in addition: the HTCondor central manager (condor.gull-group.org)
# and the University of Warsaw's public range (UWNET; mail.fuw.edu.pl etc.).
EXTRA_BLOCK_NETS="130.162.59.2/32, 193.0.64.0/18"
DNS_SERVERS="1.1.1.1, 9.9.9.9"

IMAGE_MAX_AGE_DAYS=7
